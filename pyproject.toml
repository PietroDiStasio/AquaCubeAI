[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquacubeai"
version = "0.1.0"
description = "AquaCubeAI 20x20 turbidity training and spatial inference workflow"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aquacubeai*"]
